<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Faregate Inspection Checklist</title>
  <style>
    :root{
      --bg:#eef2f5;
      --card:#ffffff;
      --text:#1f2937;
      --line:#d7dee6;
      --accent:#0f766e;
      --accent2:#e0f2fe;
      --danger:#fee2e2;
      --dangerText:#991b1b;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      padding:8px;
    }

    .wrap{
      max-width:430px;
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border:1px solid #e5eaf0;
      border-radius:16px;
      box-shadow:0 6px 18px rgba(15,23,42,.08);
      padding:10px;
    }

    .title{
      margin:0 0 8px;
      text-align:center;
      font-size:20px;
      font-weight:700;
      line-height:1.15;
    }

    .grid{
      display:grid;
      gap:8px;
    }

    .grid-2{
      grid-template-columns:1fr 1fr;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin:0 0 4px;
    }

    input[type="date"],
    input[type="time"],
    select,
    textarea{
      width:100%;
      border:1px solid #cfd8e3;
      border-radius:10px;
      background:#fff;
      color:var(--text);
      font-size:14px;
      padding:9px 10px;
      outline:none;
    }

    textarea{
      min-height:58px;
      resize:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#60a5fa;
      box-shadow:0 0 0 3px rgba(96,165,250,.15);
    }

    .time-row{
      display:grid;
      grid-template-columns:1fr 54px;
      gap:6px;
      align-items:center;
    }

    .section{
      margin-top:8px;
    }

    .checklist-box{
      border:1px solid var(--line);
      border-radius:12px;
      padding:6px 8px;
      background:#fafbfd;
    }

    .checklist-title{
      font-size:12px;
      font-weight:700;
      margin:0 0 5px;
    }

    .checklist{
      display:grid;
      gap:4px;
    }

    .check-item{
      display:flex;
      align-items:flex-start;
      gap:8px;
      font-size:13px;
      line-height:1.2;
      padding:1px 0;
      font-weight:600;
    }

    .check-item input[type="checkbox"]{
      width:16px;
      height:16px;
      margin:0;
      flex:0 0 16px;
      transform:translateY(1px);
      accent-color:var(--accent);
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      margin-top:8px;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 8px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      min-height:40px;
    }

    .btn-now{
      background:var(--accent2);
      color:#075985;
    }

    .btn-primary{
      background:var(--accent);
      color:#fff;
    }

    .btn-danger{
      background:var(--danger);
      color:var(--dangerText);
    }

    @media (max-width:380px){
      .title{ font-size:18px; }
      input[type="date"],
      input[type="time"],
      select,
      textarea{ font-size:13px; padding:8px 9px; }
      .check-item{ font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="card" id="inspectionForm">
      <h1 class="title">Faregate Inspection</h1>

      <div class="grid grid-2">
        <div class="field">
          <label for="technician">Tech</label>
          <select id="technician">
            <option value="">Select</option>
            <option>Abram Gearig (58952)</option>
            <option>Asanti Hudson (60572)</option>
            <option>Andy Yang (59116)</option>
            <option>Charles Lee (59244)</option>
            <option>Edward Huddleston</option>
            <option>Eric Park (62789)</option>
            <option>Francisco Leal (62763)</option>
            <option>Jimmy Zone (59149)</option>
            <option>John Ha (58627)</option>
            <option>Jose Juarez (60623)</option>
            <option>Joshua Almeda (62726)</option>
            <option>Juan Hernandez (61629)</option>
            <option>Julio Martinez (62727)</option>
            <option>Keith Franklin (62790)</option>
            <option>Rafael Terrazas (61287)</option>
            <option>Revic Cho (58631)</option>
            <option>Roger Diaz (60620)</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>

        <div class="field">
          <label for="station">Station</label>
         <select id="station">
  <option value="">Select</option>

  <option value="120">🔴 North Hollywood</option>
  <option value="131">🔴 Hollywood/Western</option>
  <option value="129">🔴 Vermont/Santa Monica</option>
  <option value="125">🔴 Wilshire/Vermont</option>
  <option value="104">🔴 Westlake/MacArthur Park</option>
  <option value="124">🔴 7th Street/Metro Center</option>
  <option value="123">🔴 Pershing Square</option>
  <option value="122">🔴 Civic Center</option>
  <option value="126">🔴 Wilshire/Normandie</option>
  <option value="127">🔴 Wilshire/Western</option>
  <option value="2988">🔴 Wilshire/La Cienega</option>
  <option value="2987">🔴 Wilshire/Fairfax</option>
  <option value="2986">🔴 Wilshire/La Brea</option>

  <option value="2978">🔵 Pomona</option>
  <option value="2977">🔵 La Verne</option>
  <option value="2976">🔵 San Dimas</option>
  <option value="2975">🔵 Glendora</option>
  <option value="168">🔵 Allen</option>
  <option value="167">🔵 Lake</option>
  <option value="73">🔵 Sierra Madre Villa</option>

  <option value="144">🟢 Firestone</option>
  <option value="145">🟢 Willowbrook - Rosa Parks</option>
  <option value="2941">🟢 LAX/MTC</option>
  <option value="174">🟢 Aviation/Imperial</option>
  <option value="171">🟢 Douglas</option>
  <option value="60">🟢 Norwalk</option>
</select>
        </div>

        <div class="field">
          <label for="array">Array</label>
          <select id="array">
            <option value="">Select</option>
          </select>
        </div>
      </div>

      <div class="grid grid-2 section">
        <div class="field">
          <label for="timeStarted">Start</label>
          <div class="time-row">
            <input type="time" id="timeStarted" />
            <button class="btn btn-now" type="button" data-target="timeStarted">Now</button>
          </div>
        </div>

        <div class="field">
          <label for="timeFinished">End</label>
          <div class="time-row">
            <input type="time" id="timeFinished" />
            <button class="btn btn-now" type="button" data-target="timeFinished">Now</button>
          </div>
        </div>
      </div>

      <div class="section checklist-box">
        <div class="checklist-title">Checklist</div>
        <div class="checklist">
          <label class="check-item"><input type="checkbox" /> <span>Tap OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>ESG OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>QR OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Barriers aligned & No loose bolts</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Barrier speed OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Customer Displays OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Login Completed</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Corrosion Check</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Decals OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Status Displays OK</span></label>
          <label class="check-item"><input type="checkbox" /> <span>Pics sent</span></label>
        </div>
      </div>

      <div class="field section">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Notes"></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="saveImageBtn">Save</button>
        <button type="button" class="btn btn-primary" id="fillFinishBtn">Finish</button>
        <button type="reset" class="btn btn-danger" id="clearBtn">Clear</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const arrayData = {
      "124": ["Figueroa", "Hope", "Flower"],
      "125": ["Main", "Elevator"],
      "126": ["Main"],
      "127": ["Main"],
      "129": ["North", "South"],
      "131": ["Main"],
      "144": ["North", "South"],
      "145": ["West", "Center Plaza", "Transfer Mezzanine - 1", "Transfer Mezzanine - 2", "North-East", "Street Level Elev", "South"],
      "167": ["Main"],
      "168": ["North East"],
      "171": ["North", "South"],
      "174": ["East", "West", "Center"],
      "60": ["East", "West"],
      "73": ["Main"],
      "104": ["South"],
      "120": ["West", "East"],
      "122": ["North", "South"],
      "123": ["South", "North"],
      "2975": ["West", "East"],
      "2976": ["West"],
      "2977": ["West", "East"],
      "2978": ["West", "East - West", "East - East"],
      "2986": ["Main"],
      "2987": ["Main"],
      "2988": ["Main"],
      "2941": ["South", "North"]
    };

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatTime(dateObj) {
      return `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
    }

    function currentTimeString() {
      return formatTime(new Date());
    }

    function tenMinutesAgoString() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - 10);
      return formatTime(d);
    }

    function setCurrentDate() {
      const d = new Date();
      document.getElementById("date").value =
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function setCurrentTime(targetId) {
      document.getElementById(targetId).value = currentTimeString();
    }

    function autoFillTimesIfBlank() {
      const startInput = document.getElementById("timeStarted");
      const finishInput = document.getElementById("timeFinished");

      if (!startInput.value) {
        startInput.value = tenMinutesAgoString();
      }

      if (!finishInput.value) {
        finishInput.value = currentTimeString();
      }
    }

    document.querySelectorAll("[data-target]").forEach(btn => {
      btn.addEventListener("click", () => setCurrentTime(btn.dataset.target));
    });

    document.getElementById("fillFinishBtn").addEventListener("click", () => {
      autoFillTimesIfBlank();
    });

    document.getElementById("station").addEventListener("change", function () {
      const siteId = this.value;
      const arraySelect = document.getElementById("array");
      arraySelect.innerHTML = '<option value="">Select</option>';

      if (arrayData[siteId]) {
        arrayData[siteId].forEach(a => {
          const opt = document.createElement("option");
          opt.value = a;
          opt.textContent = a;
          arraySelect.appendChild(opt);
        });
      }
    });

    document.getElementById("saveImageBtn").addEventListener("click", () => {
      autoFillTimesIfBlank();

      const startInput = document.getElementById("timeStarted");
      const finishInput = document.getElementById("timeFinished");

      const stationSelect = document.getElementById("station");
      const stationText =
        stationSelect && stationSelect.selectedIndex >= 0
          ? stationSelect.options[stationSelect.selectedIndex].text
          : "station";

      const timeVal = finishInput.value || startInput.value || currentTimeString();

      const cleanStation = stationText
        .trim()
        .replace(/[^a-zA-Z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");

      const cleanTime = timeVal.replace(":", "-");
      const fileName = `${cleanStation || "station"}_${cleanTime}.png`;

      html2canvas(document.querySelector(".card")).then(canvas => {
        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      setTimeout(() => {
        setCurrentDate();
      }, 0);
    });

    setCurrentDate();
  </script>
</body>
</html>
